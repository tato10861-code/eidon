name-template: "Eidon v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
tag-prefix: v

change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - breaking
      - "semver: major"
  minor:
    labels:
      - feature
      - enhancement
      - "semver: minor"
  patch:
    labels:
      - fix
      - bugfix
      - patch
      - dependencies
      - "semver: patch"
  default: patch

categories:
  - title: "🚀 Features"
    labels:
      - feature
      - enhancement
  - title: "🐛 Bug Fixes"
    labels:
      - fix
      - bugfix
  - title: "🔐 Security"
    labels:
      - security
  - title: "📦 Dependencies"
    labels:
      - dependencies
  - title: "🏗 Infrastructure"
    labels:
      - infrastructure
      - ci
      - docker
  - title: "📖 Documentation"
    labels:
      - documentation
  - title: "⚠️ Breaking Changes"
    labels:
      - breaking

template: |
  ## What's Changed

  $CHANGES

  ---

  **Full Changelog**: https://github.com/tato10861-code/eidon/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  ### Install

  ```bash
  # Node.js SDK
  npm install eidon@$RESOLVED_VERSION

  # Python SDK
  pip install eidon==$RESOLVED_VERSION

  # CLI
  npm install -g @eidon/cli@$RESOLVED_VERSION
  ```

  ### Docker

  ```bash
  docker pull ghcr.io/tato10861-code/eidon:$RESOLVED_VERSION
  ```
