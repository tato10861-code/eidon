name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please never include API keys, customer data or private URLs.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the actual behaviour.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Browser, OS, Node version, deployed or local"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server logs, console errors or screenshots. Redact anything sensitive.
