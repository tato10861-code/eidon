name: retrigger-release
on:
  workflow_dispatch:
jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing v0.2.0 tag
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api repos/tato10861-code/eidon/git/refs/tags/v0.2.0 \
            -X DELETE 2>/dev/null || echo "Tag did not exist"

      - name: Recreate v0.2.0 tag at current main HEAD
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api repos/tato10861-code/eidon/git/refs \
            -X POST \
            -f ref=refs/tags/v0.2.0 \
            -f sha=72c047b195a6a2fca999186c6caf70227a81776d
          echo "Done — v0.2.0 now points to 72c047b (includes CI fixes)"
