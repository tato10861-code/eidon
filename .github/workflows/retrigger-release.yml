name: Retrigger Release (v0.3.0)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Delete existing v0.3.0 tag if present
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git push origin :refs/tags/v0.3.0 || true
          gh release delete v0.3.0 --yes 2>/dev/null || true

      - name: Create v0.3.0 tag on main HEAD
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a v0.3.0 -m "Release v0.3.0"
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }} v0.3.0

      - name: Delete this workflow file
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api -X DELETE \
            /repos/${{ github.repository }}/contents/.github/workflows/retrigger-release.yml \
            -f message="ci: remove temporary retrigger workflow" \
            -f sha=$(gh api /repos/${{ github.repository }}/contents/.github/workflows/retrigger-release.yml --jq '.sha') \
            -f branch=main
