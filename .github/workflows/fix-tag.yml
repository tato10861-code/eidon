name: fix-tag

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Move v0.2.0 tag to correct merge commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE /repos/${{ github.repository }}/git/refs/tags/v0.2.0
          gh api -X POST  /repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/v0.2.0" \
            -f sha="bb347f6f56292bd979c0de65d07ff3836f9b4866"
          echo "Tag v0.2.0 now points to bb347f6"
