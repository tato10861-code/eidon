name: fix-tag

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_PAT }}

      - name: Recreate v0.2.0 tag at correct merge commit
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git tag -d v0.2.0 2>/dev/null || true
          git push origin :refs/tags/v0.2.0 2>/dev/null || true
          git tag v0.2.0 bb347f6f56292bd979c0de65d07ff3836f9b4866
          git push origin refs/tags/v0.2.0
          echo "Tag v0.2.0 now points to bb347f6"
        env:
          GIT_AUTHOR_NAME: GitHub Actions
          GIT_COMMITTER_NAME: GitHub Actions
