name: fix-tag

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing tag if present
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api repos/tato10861-code/eidon/git/refs/tags/v0.2.0 \
            -X DELETE 2>/dev/null || echo "Tag did not exist, continuing"

      - name: Create tag v0.2.0 via API
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api repos/tato10861-code/eidon/git/refs \
            -X POST \
            -f ref=refs/tags/v0.2.0 \
            -f sha=bb347f6f56292bd979c0de65d07ff3836f9b4866
          echo "Done — tag v0.2.0 created"
