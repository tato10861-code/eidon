name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  record-deployment:
    name: Record deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
          environment-url: ${{ github.event_name == 'push' && 'https://eidon-two.vercel.app' || format('https://eidon-two-git-{0}-tato10861-code.vercel.app', github.head_ref) }}
          description: "${{ github.event_name == 'push' && 'Vercel production deploy' || 'Vercel preview deploy' }}"

      - name: Mark deployment successful
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: ${{ github.event_name == 'push' && 'https://eidon-two.vercel.app' || format('https://eidon-two-git-{0}-tato10861-code.vercel.app', github.head_ref) }}
          description: "${{ github.event_name == 'push' && 'Vercel production deployment' || 'Vercel preview deployment' }}"
