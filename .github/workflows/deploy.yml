name: Deploy

on:
  push:
  pull_request:

permissions:
  contents: read
  deployments: write

jobs:
  record-deployment:
    name: Record deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IS_PROD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      BRANCH_SLUG: ${{ github.head_ref || github.ref_name }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Sanitize branch slug
        id: slug
        run: |
          raw="${{ env.BRANCH_SLUG }}"
          echo "value=${raw//\//-}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: ${{ env.IS_PROD == 'true' && 'production' || 'preview' }}
          environment-url: >-
            ${{ env.IS_PROD == 'true'
              && 'https://eidon-ta-to.vercel.app'
              || format('https://eidon-git-{0}-ta-to.vercel.app',
                        steps.slug.outputs.value) }}
          description: >-
            ${{ env.IS_PROD == 'true'
              && 'Vercel production deploy'
              || format('Vercel preview — {0}', env.BRANCH_SLUG) }}

      # Vercel's deployment checks wait for every GitHub check on this commit. A job that
      # waits for Vercel inside one of those checks is a deadlock: both sides wait forever,
      # and the deployment is eventually reported as failed even though nothing was built.
      # Record the deployment as running and let deploy-status.yml observe the real result.
      - name: Mark deployment running
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: in_progress
          environment-url: >-
            ${{ env.IS_PROD == 'true'
              && 'https://eidon-ta-to.vercel.app'
              || format('https://eidon-git-{0}-ta-to.vercel.app',
                        steps.slug.outputs.value) }}
          description: >-
            Vercel build queued for ${{ env.TARGET_SHA }}; final state is verified by the
            scheduled deployment status check
