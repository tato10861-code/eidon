name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  record-deployment:
    name: Record production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          environment-url: https://eidon-two.vercel.app
          description: "Vercel production deploy triggered by push"

      - name: Mark deployment successful
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: https://eidon-two.vercel.app
          description: "Vercel production deployment"
