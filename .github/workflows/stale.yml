name: Stale

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 30 days. It will be closed in 7 days unless
            there is new activity. Add a comment to keep it open.
          stale-pr-message: >
            This pull request has been inactive for 14 days. It will be closed in 7 days
            unless there is new activity.
          close-issue-message: "Closed due to inactivity. Re-open if this is still relevant."
          close-pr-message: "Closed due to inactivity. Re-open to continue."
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,roadmap"
          exempt-pr-labels: "pinned,security"
          operations-per-run: 100
