[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eidon"
version = "0.3.0"
description = "Official Python SDK for the Eidon AI employee platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "llm", "enterprise", "automation", "eidon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.urls]
Homepage = "https://eidon.ai"
Documentation = "https://eidon.ai/docs"
Repository = "https://github.com/tato10861-code/eidon"

[tool.hatch.build.targets.wheel]
packages = ["eidon"]

[tool.hatch.envs.default]
dependencies = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.hatch.envs.default.scripts]
test = "pytest tests/ -v --tb=short"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
